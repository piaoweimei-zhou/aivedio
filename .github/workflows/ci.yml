name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-lint:
    name: Backend flake8 (P2/P4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"
      - name: Install flake8
        run: pip install --upgrade pip && pip install flake8
      # 与本地 director.py lint / G4 门禁同规则（backend/.flake8）：0-error 基线，只挡新增
      - name: Run flake8 (no-new)
        working-directory: backend
        run: python -m flake8 .

  backend-test:
    name: Backend pytest + coverage ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"
          cache: pip
      - name: Install pinned dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest-cov
      - name: Run tests with coverage (ratchet baseline 31%)
        working-directory: backend
        run: python -m pytest --cov=. --cov-report=term-missing --cov-fail-under=31

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend-director
        run: npm ci
      - name: Build
        working-directory: frontend-director
        run: npm run build

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t director-backend .
      - name: Build frontend image
        run: docker build -f frontend-director/Dockerfile -t director-frontend ./frontend-director
