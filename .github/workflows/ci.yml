name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-test:
    name: Backend pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"
          cache: pip
      - name: Install pinned dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
      - name: Run tests
        working-directory: backend
        run: python -m pytest

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend-director
        run: npm ci
      - name: Build
        working-directory: frontend-director
        run: npm run build

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t director-backend .
      - name: Build frontend image
        run: docker build -f frontend-director/Dockerfile -t director-frontend ./frontend-director
