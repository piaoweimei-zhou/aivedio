name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # 每晚定时回归（UTC 20:00 = 北京 04:00，与 CreativeOS 12:00 错开，避免依赖源高峰）
  schedule:
    - cron: '0 20 * * *'

jobs:
  backend-lint:
    name: Backend flake8 (P2/P4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"
      - name: Install flake8
        run: pip install --upgrade pip && pip install flake8
      # 与本地 director.py lint / G4 门禁同规则（backend/.flake8）：0-error 基线，只挡新增
      - name: Run flake8 (no-new)
        working-directory: backend
        run: python -m flake8 .

  backend-test:
    name: Backend pytest + coverage ratchet
    runs-on: ubuntu-latest
    needs: backend-test-process-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"
          cache: pip
      - name: Install pinned dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest-cov
      - name: Run tests (exclude process_manager; it hangs in full-suite context on Linux)
        working-directory: backend
        timeout-minutes: 8
        # 定位结论：pytest-timeout(thread/signal) 与 pytest-asyncio 冲突，本身导致卡死——已移除。
        # process_manager 在"全量单进程"下 asyncio loop 关闭处 hang，故排除主片、单独 job 跑（独立进程天然隔离）。
        # 覆盖率：主片 42% + pm 片合并后回到 44% ratchet 基线（合并步骤在下方）。
        run: timeout 240 python -m pytest -v --ignore=tests/test_process_manager.py --cov=. --cov-report=json:cov.json --cov-fail-under=0 --junitxml=test-results.xml
      - name: Download process_manager coverage
        uses: actions/download-artifact@v4
        with:
          name: pm-coverage
          path: backend/pmcov
      - name: Merge coverage + enforce ratchet 44%
        working-directory: backend
        # 合并主片 + pm 片的 .coverage，恢复 44% ratchet 基线；<44% 则 step 失败（机器门禁）
        run: |
          coverage combine
          coverage report --fail-under=44 --format=json -o cov-merged.json
      - name: Generate nightly regression report (C 项可追踪)
        working-directory: backend
        if: always()
        run: python tools/nightly_report.py --junitxml test-results.xml --coverage cov.json --out nightly-report.json
      - name: Upload nightly report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-report
          path: backend/nightly-report.json

  backend-test-process-manager:
    name: Backend pytest (process_manager 单独)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"
          cache: pip
      - name: Install pinned dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest-cov
      - name: Run process_manager tests (isolated process)
        working-directory: backend
        timeout-minutes: 4
        # 无 pytest-timeout：thread/signal 方法与 pytest-asyncio 冲突会导致卡死（实测确认）。
        # 独立进程运行天然隔离 Linux 上 asyncio loop 关闭 hang。
        run: timeout 120 python -m pytest -v tests/test_process_manager.py --cov=. --cov-fail-under=0 --junitxml=test-results-pm.xml
      - name: Upload process_manager coverage
        uses: actions/upload-artifact@v4
        with:
          name: pm-coverage
          path: backend/.coverage

  g2-contract-smoke:
    name: G2 契约冒烟（steps 契约 + DAG 生成）
    runs-on: ubuntu-latest
    env:
      # CI 无 GPU/ComfyUI：禁用 ComfyUI 子进程管理，仅验证契约层可被后端接受
      DISABLE_PROCESS_MANAGEMENT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"
          cache: pip
      - name: Install pinned dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
      - name: Run G2 contract smoke (no external deps)
        working-directory: backend
        run: python tools/g2_regression.py

  trafficos:
    name: TrafficOS lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"
          cache: pip
      - name: Install dependencies
        working-directory: trafficos
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        working-directory: trafficos
        run: python -m flake8 app tests sdk --max-line-length=100
      - name: Test
        working-directory: trafficos
        run: python -m pytest tests -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend-director
        run: npm ci
      - name: "Lint (T2 gate: 0 error + 0 warning)"
        working-directory: frontend-director
        run: npm run lint -- --max-warnings 0
      - name: Build
        working-directory: frontend-director
        run: npm run build

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t director-backend .
      - name: Build frontend image
        run: docker build -f frontend-director/Dockerfile -t director-frontend ./frontend-director
