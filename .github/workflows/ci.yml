name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # 每晚定时回归（UTC 20:00 = 北京 04:00，与 CreativeOS 12:00 错开，避免依赖源高峰）
  schedule:
    - cron: '0 20 * * *'

jobs:
  backend-lint:
    name: Backend flake8 (P2/P4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"
      - name: Install flake8
        run: pip install --upgrade pip && pip install flake8
      # 与本地 director.py lint / G4 门禁同规则（backend/.flake8）：0-error 基线，只挡新增
      - name: Run flake8 (no-new)
        working-directory: backend
        run: python -m flake8 .

  backend-test:
    name: Backend pytest + coverage ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"
          cache: pip
      - name: Install pinned dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest-cov
      - name: Run tests with coverage (ratchet baseline 38%)
        working-directory: backend
        run: python -m pytest --cov=. --cov-report=term-missing --cov-fail-under=38

  g2-contract-smoke:
    name: G2 契约冒烟（steps 契约 + DAG 生成）
    runs-on: ubuntu-latest
    env:
      # CI 无 GPU/ComfyUI：禁用 ComfyUI 子进程管理，仅验证契约层可被后端接受
      DISABLE_PROCESS_MANAGEMENT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"
          cache: pip
      - name: Install pinned dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
      - name: Run G2 contract smoke (no external deps)
        working-directory: backend
        run: python tools/g2_regression.py

  trafficos:
    name: TrafficOS lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"
          cache: pip
      - name: Install dependencies
        working-directory: trafficos
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        working-directory: trafficos
        run: python -m flake8 app tests sdk --max-line-length=100
      - name: Test
        working-directory: trafficos
        run: python -m pytest tests -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend-director
        run: npm ci
      - name: "Lint (T2 gate: 0 error + 0 warning)"
        working-directory: frontend-director
        run: npm run lint -- --max-warnings 0
      - name: Build
        working-directory: frontend-director
        run: npm run build

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t director-backend .
      - name: Build frontend image
        run: docker build -f frontend-director/Dockerfile -t director-frontend ./frontend-director
