name: G2 全链路门禁（真实成片）

on:
  workflow_dispatch:
    inputs:
      runs:
        description: 真实一键成片回归轮数（每轮约 30 分钟）
        required: true
        default: "1"
        type: string
  push:
    tags:
      - "v*"

jobs:
  g2-full-gate:
    name: G2 一键成片全链路（发布门禁）
    runs-on: [self-hosted, gpu, comfyui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"
      - name: Install pinned dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
      - name: Run G2 full regression (gate)
        working-directory: backend
        run: python tools/g2_regression.py --full --runs ${{ github.event.inputs.runs || '1' }}
      - name: Upload G2 baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-baseline-report
          path: backend/data/oneclick_baseline_*.json

# 说明：
# - 本 workflow 是「发布门禁」：打 v* tag 或手动触发时，在带 GPU + ComfyUI +
#   provider key 的自建 runner 上执行真实一键成片回归。
# - g2_regression --full 返回码语义：
#     0 = 全链路 100% 通过（放行）
#     1 = 回归跑完但未 100%（拦截）
#     2 = 前置条件缺失（后端/ComfyUI/provider key）
# - 需自建 runner：runs-on 标签 [self-hosted, gpu, comfyui]，并预装
#   Python 3.13 + 后端依赖 + ComfyUI(127.0.0.1:8188) + provider key 环境变量。
# - 本地替代：python tools/g2_regression.py --full --runs 1
